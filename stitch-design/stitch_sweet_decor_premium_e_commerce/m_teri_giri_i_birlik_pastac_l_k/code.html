<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-surface"><main class="min-h-screen w-full flex items-center justify-center p-margin-mobile"><div class="flex flex-col w-full h-full min-h-[calc(100vh-64px)] justify-center items-center">
<div class="w-full max-w-md p-stack-lg bg-surface rounded-xl shadow-xl flex flex-col gap-stack-md border-t-4" style="border-color: var(--color-primary)">
<div class="text-center mb-stack-sm">
<h1 class="font-display-md text-display-md text-primary mb-stack-xs">Hoş Geldiniz</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Birlik Pastacılık'a tekrar hoş geldiniz.</p>
</div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">E-posta Adresi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-stack-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full h-12 pl-[40px] pr-stack-sm rounded-lg bg-surface-container border border-outline-variant focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md text-on-surface" id="email" placeholder="ornek@eposta.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Şifre</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-stack-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full h-12 pl-[40px] pr-[40px] rounded-lg bg-surface-container border border-outline-variant focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md text-on-surface" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-stack-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password'; this.querySelector('span').textContent = p.type === 'password' ? 'visibility_off' : 'visibility';" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-stack-xs">
<label class="flex items-center gap-stack-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="w-5 h-5 appearance-none border border-outline-variant rounded bg-surface-container checked:bg-primary checked:border-primary transition-colors peer cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Beni Hatırla</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Şifremi Unuttum</a>
</div>
<button class="w-full h-12 mt-stack-sm bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container active:scale-[0.98] transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-stack-xs" type="submit">
        Giriş Yap
        <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<div class="relative flex items-center justify-center mt-stack-sm">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<span class="relative px-stack-sm bg-surface font-body-sm text-body-sm text-on-surface-variant">veya</span>

</div>
</div>
